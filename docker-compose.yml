# Shared settings for the application containers (profile "app"). They reach
# the infrastructure through the compose network names.
x-app: &app
  build: .
  image: event-analytics-platform:latest
  profiles: ["app"]
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/event_analytics
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_EVENTS_TOPIC: ${KAFKA_EVENTS_TOPIC:-events}
    KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-events.dlq}
    KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-event-consumer}
    REDIS_URL: redis://redis:6379/0
    STATS_CACHE_TTL_SECONDS: ${STATS_CACHE_TTL_SECONDS:-30}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache only: persistence is disabled, so no volume.
  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (combined broker + controller, no ZooKeeper).
  # PLAINTEXT is advertised as localhost:9092 for clients on the host;
  # INTERNAL is used by other containers on the compose network.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12

  # One-shot job: creates the events and dead-letter topics explicitly
  # (auto-creation is off). The DLQ is low-volume, so one partition suffices.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic ${KAFKA_EVENTS_TOPIC:-events}
        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic ${KAFKA_DLQ_TOPIC:-events.dlq}
        --partitions 1 --replication-factor 1
    restart: "no"

  # One-shot job: applies the Alembic migrations before api and consumer start.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Exits non-zero on database or dead-letter failures so the message is
  # redelivered; compose restarts it.
  consumer:
    <<: *app
    command: ["python", "-m", "app.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
